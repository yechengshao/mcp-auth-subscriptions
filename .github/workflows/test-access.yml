name: Access, billing, and observability checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm ci --prefix billing --omit=dev
      - run: npm ci --prefix authorizer --omit=dev
      - run: npm run package:authorizer
      - run: unzip -t .artifacts/authorizer.zip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check cfn-lint==1.59.0
      - run: cfn-lint infra/observability/template.json infra/billing/*.yaml infra/access/*.yaml
      - run: git diff --check
