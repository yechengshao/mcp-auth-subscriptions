name: Access, billing, and observability checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  access:
    # Isolated: typechecks, builds and runs only the access suites, then packages the authorizer.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require lockfiles for the selected dependencies
        run: test -f package-lock.json && test -f authorizer/package-lock.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:access
      - run: npm ci --prefix authorizer --omit=dev
      - run: npm run package:authorizer
      - run: unzip -t .artifacts/authorizer.zip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check cfn-lint==1.59.0
      - run: cfn-lint infra/access/*.yaml
      - run: git diff --check
  billing:
    # Isolated: typechecks and runs only the billing and observability suites, then lints billing templates.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require lockfiles for the selected dependencies
        run: test -f package-lock.json && test -f billing/package-lock.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:billing
      - run: npm ci --prefix billing --omit=dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check cfn-lint==1.59.0
      - run: cfn-lint infra/billing/*.yaml
      - run: git diff --check
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run verify:billing
      - run: npm ci --prefix billing --omit=dev
      - run: npm ci --prefix authorizer --omit=dev
      - run: npm run package:authorizer
      - run: unzip -t .artifacts/authorizer.zip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check cfn-lint==1.59.0
      - run: cfn-lint infra/observability/template.json infra/observability/alarm-topic.yaml infra/billing/*.yaml infra/access/*.yaml
      - run: git diff --check
