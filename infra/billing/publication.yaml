{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "ECR repository and environment-scoped GitHub OIDC publisher for the Billing image only.",
  "Parameters": {
    "GithubOidcProviderArn": {
      "Type": "String",
      "AllowedPattern": "^arn:aws:iam::[0-9]{12}:oidc-provider/token\\.actions\\.githubusercontent\\.com$",
      "Description": "Reuse the account provider; this template does not create or mutate it."
    },
    "GithubSubjectPrefix": {
      "Type": "String",
      "AllowedPattern": "^repo:[A-Za-z0-9_.-]+@[0-9]+/[A-Za-z0-9_.-]+@[0-9]+$",
      "Description": "Immutable GitHub subject claim prefix (owner@id/repo@id) for the billing repository; no default, so the IDs are supplied at deploy time."
    },
    "GithubEnvironment": {
      "Type": "String",
      "Default": "billing-publish",
      "AllowedPattern": "^[A-Za-z0-9_-]{1,40}$"
    },
    "Environment": {
      "Type": "String",
      "AllowedValues": ["development", "test", "production"],
      "Default": "test"
    },
    "RepositoryName": {
      "Type": "String",
      "Default": "mcp-billing",
      "AllowedPattern": "^[a-z0-9]+([._/-][a-z0-9]+)*$"
    }
  },
  "Resources": {
    "BillingRepository": {
      "Type": "AWS::ECR::Repository",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "RepositoryName": { "Ref": "RepositoryName" },
        "ImageTagMutability": "IMMUTABLE",
        "ImageScanningConfiguration": { "ScanOnPush": true },
        "EncryptionConfiguration": { "EncryptionType": "AES256" }
      }
    },
    "BillingPublisherRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "MaxSessionDuration": 3600,
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [{
            "Effect": "Allow",
            "Principal": { "Federated": { "Ref": "GithubOidcProviderArn" } },
            "Action": "sts:AssumeRoleWithWebIdentity",
            "Condition": { "StringEquals": {
              "token.actions.githubusercontent.com:aud": "sts.amazonaws.com",
              "token.actions.githubusercontent.com:sub": {
                "Fn::Sub": "${GithubSubjectPrefix}:environment:${GithubEnvironment}"
              }
            } }
          }]
        },
        "Policies": [{
          "PolicyName": "PublishBillingImageOnly",
          "PolicyDocument": {
            "Version": "2012-10-17",
            "Statement": [
              { "Effect": "Allow", "Action": "ecr:GetAuthorizationToken", "Resource": "*" },
              { "Effect": "Allow", "Action": "ssm:PutParameter", "Resource": { "Fn::Sub": "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/mcp/${Environment}/billing/image-uri" } },
              {
                "Effect": "Allow",
                "Action": ["ecr:BatchCheckLayerAvailability", "ecr:BatchGetImage", "ecr:CompleteLayerUpload", "ecr:GetDownloadUrlForLayer", "ecr:InitiateLayerUpload", "ecr:PutImage", "ecr:UploadLayerPart"],
                "Resource": { "Fn::GetAtt": ["BillingRepository", "Arn"] }
              }
            ]
          }
        }]
      }
    }
  },
  "Outputs": {
    "BillingRepositoryArn": { "Value": { "Fn::GetAtt": ["BillingRepository", "Arn"] } },
    "BillingRepositoryUri": { "Value": { "Fn::GetAtt": ["BillingRepository", "RepositoryUri"] } },
    "BillingPublisherRoleArn": { "Value": { "Fn::GetAtt": ["BillingPublisherRole", "Arn"] } }
  }
}
