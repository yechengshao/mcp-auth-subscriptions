{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "Access OAuth/onboarding HTTP runtime; reads billing eligibility only and invokes the exact billing alias.",
  "Parameters": {
    "Environment": {
      "Type": "String",
      "AllowedValues": [
        "development",
        "test",
        "production"
      ],
      "Default": "test"
    },
    "FunctionName": {
      "Type": "String",
      "AllowedPattern": "[A-Za-z][A-Za-z0-9_-]{0,47}"
    },
    "ImageUri": {
      "Type": "String",
      "AllowedPattern": "[0-9]{12}\\.dkr\\.ecr\\.[a-z0-9-]+\\.amazonaws\\.com/[a-z0-9_./-]+@sha256:[a-f0-9]{64}"
    },
    "StateTableName": {
      "Type": "String"
    },
    "StateTableArn": {
      "Type": "String",
      "AllowedPattern": "arn:aws:dynamodb:[a-z0-9-]+:[0-9]{12}:table/[A-Za-z0-9_.-]+"
    },
    "EntitlementTableName": {
      "Type": "String"
    },
    "EntitlementTableArn": {
      "Type": "String",
      "AllowedPattern": "arn:aws:dynamodb:[a-z0-9-]+:[0-9]{12}:table/[A-Za-z0-9_.-]+"
    },
    "TelemetryPolicyArn": {
      "Type": "String"
    },
    "SigningKeyArn": {
      "Type": "String",
      "AllowedPattern": "arn:aws:kms:[a-z0-9-]+:[0-9]{12}:key/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"
    },
    "AccessConfigJson": {
      "Type": "String",
      "MinLength": 2,
      "MaxLength": 3000,
      "NoEcho": false
    },
    "PublicJwksJson": {
      "Type": "String",
      "MinLength": 2,
      "MaxLength": 3000,
      "NoEcho": false
    },
    "SigningConfigJson": {
      "Type": "String",
      "MinLength": 2,
      "MaxLength": 1500,
      "NoEcho": false
    },
    "ProvisioningConfigJson": {
      "Type": "String",
      "MinLength": 2,
      "MaxLength": 1500,
      "NoEcho": false
    },
    "TokenTtlSeconds": {
      "Type": "Number",
      "MinValue": 60,
      "MaxValue": 3600,
      "Default": 3600
    },
    "ReleaseId": {
      "Type": "String",
      "AllowedPattern": "[A-Za-z0-9_.-]{1,96}"
    },
    "TracingMode": {
      "Type": "String",
      "AllowedValues": [
        "Active",
        "PassThrough"
      ],
      "Default": "PassThrough"
    }
  },
  "Resources": {
    "Role": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "lambda.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        },
        "ManagedPolicyArns": [
          {
            "Ref": "TelemetryPolicyArn"
          }
        ],
        "Policies": [
          {
            "PolicyName": "AccessDependencies",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": [
                    "dynamodb:GetItem",
                    "dynamodb:PutItem",
                    "dynamodb:ConditionCheckItem"
                  ],
                  "Resource": {
                    "Ref": "StateTableArn"
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "dynamodb:GetItem",
                    "dynamodb:ConditionCheckItem"
                  ],
                  "Resource": {
                    "Ref": "EntitlementTableArn"
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": "lambda:InvokeFunction",
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:mcp-billing-${Environment}:live"
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": "ssm:GetParameter",
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/mcp/${Environment}/billing/alias-arn"
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": "kms:Sign",
                  "Resource": {
                    "Ref": "SigningKeyArn"
                  },
                  "Condition": {
                    "StringEquals": {
                      "kms:SigningAlgorithm": "RSASSA_PKCS1_V1_5_SHA_256"
                    }
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": "kms:GetPublicKey",
                  "Resource": {
                    "Ref": "SigningKeyArn"
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": "apigateway:POST",
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:apigateway:${AWS::Region}::/apikeys"
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": "apigateway:GET",
                  "Resource": [
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:apigateway:${AWS::Region}::/apikeys"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:apigateway:${AWS::Region}::/usageplans"
                    }
                  ]
                },
                {
                  "Effect": "Allow",
                  "Action": "apigateway:POST",
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:apigateway:${AWS::Region}::/usageplans/*/keys"
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": "apigateway:DELETE",
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:apigateway:${AWS::Region}::/usageplans/*/keys/*"
                  }
                }
              ]
            }
          }
        ]
      }
    },
    "Function": {
      "Type": "AWS::Lambda::Function",
      "Properties": {
        "FunctionName": {
          "Ref": "FunctionName"
        },
        "PackageType": "Image",
        "Code": {
          "ImageUri": {
            "Ref": "ImageUri"
          }
        },
        "Role": {
          "Fn::GetAtt": [
            "Role",
            "Arn"
          ]
        },
        "Architectures": [
          "arm64"
        ],
        "MemorySize": 512,
        "Timeout": 30,
        "TracingConfig": {
          "Mode": {
            "Ref": "TracingMode"
          }
        },
        "Environment": {
          "Variables": {
            "MCP_SERVICE": "access",
            "MCP_ENVIRONMENT": {
              "Ref": "Environment"
            },
            "MCP_RELEASE": {
              "Ref": "ReleaseId"
            },
            "ACCESS_STATE_TABLE": {
              "Ref": "StateTableName"
            },
            "BILLING_ENTITLEMENTS_TABLE": {
              "Ref": "EntitlementTableName"
            },
            "ACCESS_AWS_ACCOUNT_ID": {
              "Ref": "AWS::AccountId"
            },
            "BILLING_ALIAS_PARAMETER_NAME": {
              "Fn::Sub": "/mcp/${Environment}/billing/alias-arn"
            },
            "ACCESS_CONFIG_JSON": {
              "Ref": "AccessConfigJson"
            },
            "ACCESS_PUBLIC_JWKS_JSON": {
              "Ref": "PublicJwksJson"
            },
            "ACCESS_SIGNING_CONFIG_JSON": {
              "Ref": "SigningConfigJson"
            },
            "ACCESS_PROVISIONING_CONFIG_JSON": {
              "Ref": "ProvisioningConfigJson"
            },
            "ACCESS_TOKEN_TTL_SECONDS": {
              "Ref": "TokenTtlSeconds"
            }
          }
        }
      }
    },
    "Version": {
      "Type": "AWS::Lambda::Version",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "FunctionName": {
          "Ref": "Function"
        },
        "Description": {
          "Ref": "ReleaseId"
        }
      }
    },
    "Alias": {
      "Type": "AWS::Lambda::Alias",
      "Properties": {
        "Name": "live",
        "FunctionName": {
          "Ref": "Function"
        },
        "FunctionVersion": {
          "Fn::GetAtt": [
            "Version",
            "Version"
          ]
        }
      }
    },
    "AccessAliasParameter": {
      "Type": "AWS::SSM::Parameter",
      "Properties": {
        "Name": {
          "Fn::Sub": "/mcp/${Environment}/access/alias-arn"
        },
        "Type": "String",
        "Tier": "Standard",
        "Value": {
          "Ref": "Alias"
        },
        "Description": "Access live alias ARN. Read by consumers at runtime."
      }
    }
  },
  "Outputs": {
    "AccessAliasArn": {
      "Value": {
        "Ref": "Alias"
      }
    },
    "AccessRoleArn": {
      "Value": {
        "Fn::GetAtt": [
          "Role",
          "Arn"
        ]
      }
    },
    "AccessFunctionArn": {
      "Value": {
        "Fn::GetAtt": [
          "Function",
          "Arn"
        ]
      }
    },
    "AccessAliasParameterName": {
      "Value": {
        "Fn::Sub": "/mcp/${Environment}/access/alias-arn"
      }
    }
  }
}
