{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "JWT-only REST REQUEST authorizer. No datastore/signing grants, public invoke grant, API ownership or Function URL. Gateway owns exact alias invocation permission.",
  "Parameters": {
    "Environment": {
      "Type": "String",
      "AllowedValues": [
        "development",
        "test",
        "production"
      ],
      "Default": "test"
    },
    "FunctionName": {
      "Type": "String",
      "AllowedPattern": "[A-Za-z][A-Za-z0-9_-]{0,63}"
    },
    "ArtifactBucket": {
      "Type": "AWS::SSM::Parameter::Value<String>",
      "Default": "/mcp/test/authorizer/artifact-bucket",
      "Description": "Release bucket of the authorizer ZIP, written by the publish workflow."
    },
    "ArtifactKey": {
      "Type": "AWS::SSM::Parameter::Value<String>",
      "Default": "/mcp/test/authorizer/artifact-key",
      "Description": "S3 key of the authorizer ZIP, written by the publish workflow."
    },
    "ArtifactVersion": {
      "Type": "AWS::SSM::Parameter::Value<String>",
      "Default": "/mcp/test/authorizer/artifact-version",
      "Description": "S3 object version of the authorizer ZIP, written by the publish workflow."
    },
    "PackageSha256": {
      "Type": "AWS::SSM::Parameter::Value<String>",
      "Default": "/mcp/test/authorizer/artifact-sha256",
      "Description": "Base64 SHA-256 of the ZIP package, written by the publish workflow; pins the published Lambda version."
    },
    "ReleaseId": {
      "Type": "String",
      "AllowedPattern": "[A-Za-z0-9_.-]{1,96}"
    },
    "TelemetryPolicyArn": {
      "Type": "String",
      "Description": "Exact authorizer telemetry-policy output; grants own finite logs and configured native X-Ray export only."
    },
    "TracingMode": {
      "Type": "String",
      "AllowedValues": [
        "Active",
        "PassThrough"
      ],
      "Default": "PassThrough"
    }
  },
  "Resources": {
    "Role": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "lambda.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        },
        "ManagedPolicyArns": [
          {
            "Ref": "TelemetryPolicyArn"
          }
        ]
      }
    },
    "Function": {
      "Type": "AWS::Lambda::Function",
      "Properties": {
        "FunctionName": {
          "Ref": "FunctionName"
        },
        "Runtime": "nodejs24.x",
        "Handler": "authorizer/handler.handler",
        "Code": {
          "S3Bucket": {
            "Ref": "ArtifactBucket"
          },
          "S3Key": {
            "Ref": "ArtifactKey"
          },
          "S3ObjectVersion": {
            "Ref": "ArtifactVersion"
          }
        },
        "Role": {
          "Fn::GetAtt": [
            "Role",
            "Arn"
          ]
        },
        "Architectures": [
          "arm64"
        ],
        "MemorySize": 256,
        "Timeout": 5,
        "TracingConfig": {
          "Mode": {
            "Ref": "TracingMode"
          }
        },
        "Environment": {
          "Variables": {
            "MCP_SERVICE": "authorizer",
            "MCP_ENVIRONMENT": {
              "Ref": "Environment"
            },
            "MCP_RELEASE": {
              "Ref": "ReleaseId"
            }
          }
        }
      }
    },
    "Version": {
      "Type": "AWS::Lambda::Version",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "FunctionName": {
          "Ref": "Function"
        },
        "Description": {
          "Ref": "ReleaseId"
        },
        "CodeSha256": {
          "Ref": "PackageSha256"
        }
      }
    },
    "Alias": {
      "Type": "AWS::Lambda::Alias",
      "Properties": {
        "Name": "live",
        "FunctionName": {
          "Ref": "Function"
        },
        "FunctionVersion": {
          "Fn::GetAtt": [
            "Version",
            "Version"
          ]
        }
      }
    },
    "AliasParameter": {
      "Type": "AWS::SSM::Parameter",
      "Properties": {
        "Name": {
          "Fn::Sub": "/mcp/${Environment}/authorizer/alias-arn"
        },
        "Type": "String",
        "Tier": "Standard",
        "Value": {
          "Ref": "Alias"
        },
        "Description": "Authorizer live alias ARN. Read by consumers at runtime."
      }
    }
  },
  "Outputs": {
    "AuthorizerAliasArn": {
      "Value": {
        "Ref": "Alias"
      }
    },
    "AuthorizerRoleArn": {
      "Value": {
        "Fn::GetAtt": [
          "Role",
          "Arn"
        ]
      }
    },
    "AuthorizerFunctionArn": {
      "Value": {
        "Fn::GetAtt": [
          "Function",
          "Arn"
        ]
      }
    },
    "AliasParameterName": {
      "Value": {
        "Fn::Sub": "/mcp/${Environment}/authorizer/alias-arn"
      }
    }
  }
}
