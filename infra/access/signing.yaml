{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "Access JWT signing key: a retained RSA 2048 KMS key for RS256 signing. The private key never leaves KMS. Runtime grants (kms:Sign, kms:GetPublicKey on this key only) live in infra/access/runtime.yaml.",
  "Parameters": {
    "SigningKeyAlias": {
      "Type": "String",
      "Default": "alias/mcp-access-signing",
      "AllowedPattern": "^alias/[A-Za-z0-9/_-]{1,250}$"
    }
  },
  "Resources": {
    "SigningKey": {
      "Type": "AWS::KMS::Key",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "Description": "RS256 signing key for access service tokens. Sign and GetPublicKey are granted to the access runtime role only.",
        "KeySpec": "RSA_2048",
        "KeyUsage": "SIGN_VERIFY",
        "Enabled": true,
        "KeyPolicy": {
          "Version": "2012-10-17",
          "Statement": [{
            "Sid": "AccountAdministrationDelegatesToIam",
            "Effect": "Allow",
            "Principal": { "AWS": { "Fn::Sub": "arn:${AWS::Partition}:iam::${AWS::AccountId}:root" } },
            "Action": "kms:*",
            "Resource": "*"
          }]
        }
      }
    },
    "SigningKeyAliasResource": {
      "Type": "AWS::KMS::Alias",
      "Properties": {
        "AliasName": { "Ref": "SigningKeyAlias" },
        "TargetKeyId": { "Ref": "SigningKey" }
      }
    }
  },
  "Outputs": {
    "SigningKeyArn": {
      "Description": "Pass to infra/access/runtime.yaml as SigningKeyArn and as keyArn in SigningConfigJson.",
      "Value": { "Fn::GetAtt": ["SigningKey", "Arn"] }
    }
  }
}
