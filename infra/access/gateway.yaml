{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "Access REST API: REQUEST authorizer, paid MCP/health methods with CUSTOM auth and API keys, access OAuth/onboarding/billing routes on the access alias, the Stripe webhook on the billing alias, explicit deployment and named stage. Native usage plans are created from access provisioning inputs, not here.",
  "Parameters": {
    "StageName": {
      "Type": "String",
      "Default": "test",
      "AllowedPattern": "^[a-z][a-z0-9-]{0,31}$"
    },
    "ReleaseId": {
      "Type": "String",
      "AllowedPattern": "[A-Za-z0-9_.-]{1,96}"
    },
    "ServiceAliasArn": {
      "Type": "String",
      "AllowedPattern": "arn:aws:lambda:[a-z0-9-]+:[0-9]{12}:function:[A-Za-z0-9_-]+:[A-Za-z][A-Za-z0-9_-]*"
    },
    "AccessAliasArn": {
      "Type": "String",
      "AllowedPattern": "arn:aws:lambda:[a-z0-9-]+:[0-9]{12}:function:[A-Za-z0-9_-]+:[A-Za-z][A-Za-z0-9_-]*"
    },
    "BillingWebhookAliasArn": {
      "Type": "String",
      "AllowedPattern": "arn:aws:lambda:[a-z0-9-]+:[0-9]{12}:function:[A-Za-z0-9_-]+:[A-Za-z][A-Za-z0-9_-]*"
    },
    "AuthorizerAliasArn": {
      "Type": "String",
      "AllowedPattern": "arn:aws:lambda:[a-z0-9-]+:[0-9]{12}:function:[A-Za-z0-9_-]+:[A-Za-z][A-Za-z0-9_-]*"
    },
    "ResourceMetadataUrl": {
      "Type": "String",
      "AllowedPattern": "^https://[^\\s]+$",
      "Description": "Exact HTTPS URL advertised in the WWW-Authenticate challenge."
    },
    "IssuerPathPrefix": {
      "Type": "String",
      "AllowedPattern": "^[a-z0-9-]{1,64}$",
      "Description": "Path component of the issuer URL; the path-suffixed discovery routes use it."
    },
    "AccessLogGroupArn": {
      "Type": "String",
      "Default": "",
      "AllowedPattern": "^(arn:aws:logs:[a-z0-9-]+:[0-9]{12}:log-group:[^:*]+)?$",
      "Description": "Empty on the first pass. Set to the stage access log group created by infra/observability after this stack exists."
    },
    "TracingEnabled": {
      "Type": "String",
      "AllowedValues": [
        "true",
        "false"
      ],
      "Default": "false"
    },
    "Environment": {
      "Type": "String",
      "AllowedValues": [
        "development",
        "test",
        "production"
      ],
      "Default": "test"
    }
  },
  "Conditions": {
    "HasAccessLog": {
      "Fn::Not": [
        {
          "Fn::Equals": [
            {
              "Ref": "AccessLogGroupArn"
            },
            ""
          ]
        }
      ]
    }
  },
  "Resources": {
    "RestApi": {
      "Type": "AWS::ApiGateway::RestApi",
      "Properties": {
        "Name": {
          "Fn::Sub": "mcp-access-${StageName}"
        },
        "Description": "Access REST API for MCP subscriptions. No HTTP API payload-format fields.",
        "ApiKeySourceType": "AUTHORIZER",
        "EndpointConfiguration": {
          "Types": [
            "REGIONAL"
          ]
        },
        "DisableExecuteApiEndpoint": false
      }
    },
    "Authorizer": {
      "Type": "AWS::ApiGateway::Authorizer",
      "Properties": {
        "Name": "mcp-access-request-authorizer",
        "RestApiId": {
          "Ref": "RestApi"
        },
        "Type": "REQUEST",
        "IdentitySource": "method.request.header.Authorization",
        "AuthorizerResultTtlInSeconds": 0,
        "AuthorizerUri": {
          "Fn::Sub": "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerAliasArn}/invocations"
        }
      }
    },
    "AuthorizerInvokePermission": {
      "Type": "AWS::Lambda::Permission",
      "Properties": {
        "Action": "lambda:InvokeFunction",
        "FunctionName": {
          "Ref": "AuthorizerAliasArn"
        },
        "Principal": "apigateway.amazonaws.com",
        "SourceAccount": {
          "Ref": "AWS::AccountId"
        },
        "SourceArn": {
          "Fn::Sub": "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/authorizers/${Authorizer}"
        }
      }
    },
    "ServiceInvokePermission": {
      "Type": "AWS::Lambda::Permission",
      "Properties": {
        "Action": "lambda:InvokeFunction",
        "FunctionName": {
          "Ref": "ServiceAliasArn"
        },
        "Principal": "apigateway.amazonaws.com",
        "SourceAccount": {
          "Ref": "AWS::AccountId"
        },
        "SourceArn": {
          "Fn::Sub": "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/${StageName}/*/*"
        }
      }
    },
    "AccessInvokePermission": {
      "Type": "AWS::Lambda::Permission",
      "Properties": {
        "Action": "lambda:InvokeFunction",
        "FunctionName": {
          "Ref": "AccessAliasArn"
        },
        "Principal": "apigateway.amazonaws.com",
        "SourceAccount": {
          "Ref": "AWS::AccountId"
        },
        "SourceArn": {
          "Fn::Sub": "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/${StageName}/*/*"
        }
      }
    },
    "BillingWebhookInvokePermission": {
      "Type": "AWS::Lambda::Permission",
      "Properties": {
        "Action": "lambda:InvokeFunction",
        "FunctionName": {
