{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "Access REST API: REQUEST authorizer, paid MCP/health methods with CUSTOM auth and API keys, access OAuth/onboarding/billing routes on the access alias, the Stripe webhook on the billing alias, explicit deployment and named stage. Native usage plans are created from access provisioning inputs, not here.",
  "Parameters": {
    "StageName": {
      "Type": "String",
      "Default": "test",
      "AllowedPattern": "^[a-z][a-z0-9-]{0,31}$"
    },
    "ReleaseId": {
      "Type": "String",
      "AllowedPattern": "[A-Za-z0-9_.-]{1,96}"
    },
    "ServiceAliasParameter": {
      "Type": "AWS::SSM::Parameter::Value<String>",
      "Default": "/mcp/test/service/alias-arn",
      "Description": "Name of the SSM parameter that publishes this alias ARN; resolved at deploy time."
    },
    "AccessAliasParameter": {
      "Type": "AWS::SSM::Parameter::Value<String>",
      "Default": "/mcp/test/access/alias-arn",
      "Description": "Name of the SSM parameter that publishes this alias ARN; resolved at deploy time."
    },
    "BillingWebhookAliasParameter": {
      "Type": "AWS::SSM::Parameter::Value<String>",
      "Default": "/mcp/test/billing/alias-arn",
      "Description": "Name of the SSM parameter that publishes this alias ARN; resolved at deploy time."
    },
    "AuthorizerAliasParameter": {
      "Type": "AWS::SSM::Parameter::Value<String>",
      "Default": "/mcp/test/authorizer/alias-arn",
      "Description": "Name of the SSM parameter that publishes this alias ARN; resolved at deploy time."
    },
    "ResourceMetadataUrl": {
      "Type": "AWS::SSM::Parameter::Value<String>",
      "Default": "/mcp/test/access/resource-metadata-url",
      "Description": "SSM parameter holding the protected-resource metadata URL, published by infra/access/public-urls.yaml. Advertised in the WWW-Authenticate challenge."
    },
    "TracingEnabled": {
      "Type": "String",
      "AllowedValues": [
        "true",
        "false"
      ],
      "Default": "false"
    },
    "Environment": {
      "Type": "String",
      "AllowedValues": [
        "development",
        "test",
        "production"
      ],
      "Default": "test"
    }
  },
  "Resources": {
    "RestApi": {
      "Type": "AWS::ApiGateway::RestApi",
      "Properties": {
        "Name": {
          "Fn::Sub": "mcp-access-${StageName}"
        },
        "Description": "Access REST API for MCP subscriptions. No HTTP API payload-format fields.",
        "ApiKeySourceType": "AUTHORIZER",
        "EndpointConfiguration": {
          "Types": [
            "REGIONAL"
          ]
        },
        "DisableExecuteApiEndpoint": false
      }
    },
    "Authorizer": {
      "Type": "AWS::ApiGateway::Authorizer",
      "Properties": {
        "Name": "mcp-access-request-authorizer",
        "RestApiId": {
          "Ref": "RestApi"
        },
        "Type": "REQUEST",
        "IdentitySource": "method.request.header.Authorization",
        "AuthorizerResultTtlInSeconds": 0,
        "AuthorizerUri": {
          "Fn::Sub": "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerAliasParameter}/invocations"
        }
      }
    },
    "AuthorizerInvokePermission": {
      "Type": "AWS::Lambda::Permission",
      "Properties": {
        "Action": "lambda:InvokeFunction",
        "FunctionName": {
          "Ref": "AuthorizerAliasParameter"
        },
        "Principal": "apigateway.amazonaws.com",
        "SourceAccount": {
          "Ref": "AWS::AccountId"
        },
        "SourceArn": {
          "Fn::Sub": "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/authorizers/${Authorizer}"
        }
      }
    },
    "ServiceInvokePermission": {
      "Type": "AWS::Lambda::Permission",
      "Properties": {
        "Action": "lambda:InvokeFunction",
        "FunctionName": {
          "Ref": "ServiceAliasParameter"
        },
        "Principal": "apigateway.amazonaws.com",
        "SourceAccount": {
          "Ref": "AWS::AccountId"
        },
        "SourceArn": {
          "Fn::Sub": "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/${StageName}/*/*"
        }
      }
    },
    "AccessInvokePermission": {
      "Type": "AWS::Lambda::Permission",
      "Properties": {
        "Action": "lambda:InvokeFunction",
        "FunctionName": {
          "Ref": "AccessAliasParameter"
        },
        "Principal": "apigateway.amazonaws.com",
        "SourceAccount": {
          "Ref": "AWS::AccountId"
        },
        "SourceArn": {
          "Fn::Sub": "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/${StageName}/*/*"
        }
      }
    },
    "BillingWebhookInvokePermission": {
      "Type": "AWS::Lambda::Permission",
      "Properties": {
        "Action": "lambda:InvokeFunction",
        "FunctionName": {
          "Ref": "BillingWebhookAliasParameter"
        },
        "Principal": "apigateway.amazonaws.com",
        "SourceAccount": {
          "Ref": "AWS::AccountId"
        },
        "SourceArn": {
          "Fn::Sub": "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/${StageName}/POST/webhooks/stripe"
