    "BasicUsagePlan": {
      "Type": "AWS::ApiGateway::UsagePlan",
      "DependsOn": [
        "Stage"
      ],
      "Properties": {
        "UsagePlanName": {
          "Fn::Sub": "mcp-access-${StageName}-basic"
        },
        "Description": "Paid API-key usage plan for the basic catalog entry: 5 requests/second sustained, burst 10, quota 10,000 requests per month.",
        "Throttle": {
          "RateLimit": 5,
          "BurstLimit": 10
        },
        "Quota": {
          "Limit": 10000,
          "Period": "MONTH"
        },
        "ApiStages": [
          {
            "ApiId": {
              "Ref": "RestApi"
            },
            "Stage": {
              "Ref": "StageName"
            }
          }
        ]
      }
    },
    "Stage": {
      "Type": "AWS::ApiGateway::Stage",
      "Properties": {
        "RestApiId": {
          "Ref": "RestApi"
        },
        "DeploymentId": {
          "Ref": "Deployment"
        },
        "StageName": {
          "Ref": "StageName"
        },
        "TracingEnabled": {
          "Ref": "TracingEnabled"
        },
        "AccessLogSetting": {
          "DestinationArn": {
            "Fn::GetAtt": [
              "AccessLogGroup",
              "Arn"
            ]
          },
          "Format": "{\"requestId\":\"$context.requestId\",\"path\":\"$context.path\",\"status\":\"$context.status\",\"integrationStatus\":\"$context.integrationStatus\",\"errorType\":\"$context.error.responseType\",\"latencyMs\":\"$context.responseLatency\"}"
        },
        "MethodSettings": [
          {
            "ResourcePath": "/*",
            "HttpMethod": "*",
            "LoggingLevel": "ERROR",
            "DataTraceEnabled": false,
            "MetricsEnabled": false
          }
        ]
      },
      "DependsOn": [
        "Account"
      ]
    },
    "UsagePlanIdParameter": {
      "Type": "AWS::SSM::Parameter",
      "Properties": {
        "Name": {
          "Fn::Sub": "/mcp/${Environment}/access-api/usage-plan-id"
        },
        "Type": "String",
        "Tier": "Standard",
        "Value": {
          "Ref": "BasicUsagePlan"
        },
        "Description": "Basic usage plan ID for the catalog. Read by the catalog check and purchase path."
      }
    },
    "AccessLogGroup": {
      "Type": "AWS::Logs::LogGroup",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "LogGroupName": {
          "Fn::Sub": "/aws/apigateway/mcp-access-${StageName}/access"
        },
        "RetentionInDays": 14,
        "Tags": [
          {
            "Key": "Project",
            "Value": "mcp-auth-subscriptions"
          },
          {
            "Key": "Environment",
            "Value": {
              "Ref": "Environment"
            }
          }
        ]
      }
    },
    "RestApiIdParameter": {
      "Type": "AWS::SSM::Parameter",
      "Properties": {
        "Name": {
          "Fn::Sub": "/mcp/${Environment}/access-api/rest-api-id"
        },
        "Type": "String",
        "Tier": "Standard",
        "Value": {
          "Ref": "RestApi"
        },
        "Description": "REST API ID for observability and the access gateway log group."
      }
    },
    "RestApiStageParameter": {
      "Type": "AWS::SSM::Parameter",
      "Properties": {
        "Name": {
          "Fn::Sub": "/mcp/${Environment}/access-api/stage"
        },
        "Type": "String",
        "Tier": "Standard",
        "Value": {
          "Ref": "StageName"
        },
        "Description": "Deployed gateway stage name. Billing reads it to match plan mappings to this deployment."
      }
    },
    "ApiGatewayCloudWatchRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "Description": "Lets API Gateway write its access and execution logs to CloudWatch Logs. Account-level: set once through the AWS::ApiGateway::Account resource.",
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "apigateway.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        },
        "ManagedPolicyArns": [
          {
            "Fn::Sub": "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs"
          }
        ]
      }
    },
    "Account": {
      "Type": "AWS::ApiGateway::Account",
      "Properties": {
        "CloudWatchRoleArn": {
          "Fn::GetAtt": [
            "ApiGatewayCloudWatchRole",
            "Arn"
          ]
        }
      }
    }
  },
  "Outputs": {
    "RestApiId": {
      "Value": {
        "Ref": "RestApi"
      }
