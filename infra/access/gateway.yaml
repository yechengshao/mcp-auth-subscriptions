      }
    },
    "GatewayUnauthorizedResponse": {
      "Type": "AWS::ApiGateway::GatewayResponse",
      "Properties": {
        "RestApiId": {
          "Ref": "RestApi"
        },
        "ResponseType": "UNAUTHORIZED",
        "StatusCode": "401",
        "ResponseParameters": {
          "gatewayresponse.header.WWW-Authenticate": {
            "Fn::Sub": "'Bearer resource_metadata=\"${ResourceMetadataUrl}\"'"
