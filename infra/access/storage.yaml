AWSTemplateFormatVersion: '2010-09-09'
Description: Retained access state only; no billing writes, worker, stream, queue or schedule.
Resources:
  AccessState:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${AWS::StackName}-state'
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: delete_after
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  AccessStatePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:ConditionCheckItem
            Resource: !GetAtt AccessState.Arn
Outputs:
  AccessStateName:
    Value: !Ref AccessState
  AccessStateArn:
    Value: !GetAtt AccessState.Arn
  AccessStatePolicyArn:
    Value: !Ref AccessStatePolicy
