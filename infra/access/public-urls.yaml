AWSTemplateFormatVersion: '2010-09-09'
Description: Public issuer and MCP resource URLs for the access runtime, published to Parameter Store. Defaults are the tradingview.chat access host; the runtime refuses to start on a non-HTTPS or UNSET value, so a missing value fails closed. Update by redeploying this stack with the real URLs.
Parameters:
  Environment:
    Type: String
    AllowedValues:
      - development
      - test
      - production
    Default: test
  IssuerUrl:
    Type: String
    Default: https://access.tradingview.chat
    AllowedPattern: '^(UNSET|https://[^\s]{1,2000})$'
    Description: Public HTTPS base URL that issues access tokens (the coordinator's issuer). UNSET until the domain is known.
  ResourceUrl:
    Type: String
    Default: https://access.tradingview.chat/mcp
    AllowedPattern: '^(UNSET|https://[^\s]{1,2000}/mcp)$'
    Description: Public HTTPS URL of the protected MCP resource, ending in /mcp. UNSET until the domain is known.
  ResourceMetadataUrl:
    Type: String
    Default: https://access.tradingview.chat/.well-known/oauth-protected-resource
    AllowedPattern: '^(UNSET|https://[^\s]{1,2000}/\.well-known/oauth-protected-resource)$'
    Description: Public HTTPS URL of the protected-resource metadata document, advertised in the 401 challenge. UNSET until the domain is known.
Conditions:
  IssuerIsSet: !Not [!Equals [!Ref IssuerUrl, UNSET]]
Resources:
  IssuerUrlParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/mcp/${Environment}/access/issuer-url'
      Type: String
      Tier: Standard
      Value: !Ref IssuerUrl
      Description: Public access issuer URL read by the access runtime.
  ResourceUrlParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/mcp/${Environment}/access/resource-url'
      Type: String
      Tier: Standard
      Value: !Ref ResourceUrl
      Description: Public MCP resource URL read by the access runtime.
  ResourceMetadataUrlParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/mcp/${Environment}/access/resource-metadata-url'
      Type: String
      Tier: Standard
      Value: !Ref ResourceMetadataUrl
      Description: Protected-resource metadata URL read by the gateway at deploy time.
  BillingSuccessUrlParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/mcp/${Environment}/access/billing-success-url'
      Type: String
      Tier: Standard
      Value: !If [IssuerIsSet, !Sub '${IssuerUrl}/billing/return', UNSET]
      Description: Stripe Checkout success return URL for the billing runtime. Derived from the issuer URL.
  BillingCancelUrlParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/mcp/${Environment}/access/billing-cancel-url'
      Type: String
      Tier: Standard
      Value: !If [IssuerIsSet, !Sub '${IssuerUrl}/billing', UNSET]
      Description: Stripe Checkout cancel return URL for the billing runtime. Derived from the issuer URL.
Outputs:
  IssuerUrlParameterName:
    Value: !Ref IssuerUrlParameter
  ResourceUrlParameterName:
    Value: !Ref ResourceUrlParameter
  ResourceMetadataUrlParameterName:
    Value: !Ref ResourceMetadataUrlParameter
  BillingSuccessUrlParameterName:
    Value: !Ref BillingSuccessUrlParameter
  BillingCancelUrlParameterName:
    Value: !Ref BillingCancelUrlParameter
